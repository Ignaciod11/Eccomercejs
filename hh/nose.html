<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora CSS</title>
    <link rel="stylesheet" href="archivo.css">
</head>
<body>
    <main class="calculadora">
        <section class="pantalla" aria-label="Pantalla de calculadora">
           <input type="text" class="pantallAinput" value="0" aria-label="Entrada de calculadora" autocomplete="off">
        </section>

        <div class="botones">
            <button type="button" class="botoNreinicio">C</button>
            <button type="button" class="boton operador">±</button>
            <button type="button" class="boton operador">%</button>
            <button type="button" class="boton  operador">/</button>

            <button type="button" class="boton">7</button>
            <button type="button" class="boton">8</button>
            <button type="button" class="boton">9</button>
            <button type="button" class="boton operador">*</button>

            <button type="button" class="boton">4</button>
            <button type="button" class="boton">5</button>
            <button type="button" class="boton">6</button>
            <button type="button" class="boton operador res">-</button>

            <button type="button" class="boton">1</button>
            <button type="button" class="boton">2</button>
            <button type="button" class="boton">3</button>
            <button type="button" class="boton operador ">+</button>

            <button type="button" class="boton cero">0</button>
            <button type="button" class="boton">.</button>
            <button type="button" class="boton operador igual">=</button>
        </div>
    </main>
    <script src="cod.js"></script>
</body>
</html>
