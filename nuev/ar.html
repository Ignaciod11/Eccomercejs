<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Piedra, Papel o Tijera — Diseño</title>
   <link rel="stylesheet" href="dis.css">
   <meta name="description" content="Diseño de Piedra Papel Tijera sólo con HTML y CSS">
</head>
<body>
   <main class="rps-page">
      <header class="rps-header">
         <h1>Piedra, Papel o Tijera</h1>
         <p class="subtitle">Interfaz visual hecha con HTML y CSS + JavaScript</p>
      </header>

      <section class="rps-container" id="contenedor">
         <p class="prompt">Elige tu jugada</p>
         <div class="choices" role="group" aria-label="Opciones de juego">
            <button class="choice piedra">
               <span class="icon">✊</span>
               <span class="label">Piedra</span>
            </button>

            <button class="choice papel">
               <span class="icon">✋</span>
               <span class="label">Papel</span>
            </button>

            <button class="choice tijera">
               <span class="icon">✌️</span>
               <span class="label">Tijera</span>
            </button>
         </div>
         <div class="message-area">
            <p class="result"></p>
<button class="reset">REINICIAR</button>
         </div>
      </section>
   </main>

   <script src="co.js"></script>
</body>
</html>
